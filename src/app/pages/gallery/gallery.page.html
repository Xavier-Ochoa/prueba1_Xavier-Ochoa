<ion-header>
  <ion-toolbar color="primary">
    <ion-title>
      <ion-icon name="images-outline" style="vertical-align:middle;margin-right:6px"></ion-icon>
      Galería
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <!-- Estado vacío -->
  <div *ngIf="totalFotos === 0" class="empty-state">
    <ion-icon name="images-outline" color="medium"></ion-icon>
    <h3>Sin fotos aún</h3>
    <p>Ve a la pestaña <strong>Cámara</strong> y toma tu primera foto</p>
    <ion-icon name="camera-outline" color="primary" class="hint-icon"></ion-icon>
  </div>

  <!-- Contador de fotos -->
  <div *ngIf="totalFotos > 0" class="photos-header ion-padding-horizontal ion-padding-top">
    <ion-text color="medium">
      <p>{{ totalFotos }} foto{{ totalFotos !== 1 ? 's' : '' }} guardada{{ totalFotos !== 1 ? 's' : '' }}</p>
    </ion-text>
  </div>

  <!-- Grilla de fotos -->
  <ion-grid *ngIf="totalFotos > 0" class="photo-grid">
    <ion-row>
      <ion-col size="6" *ngFor="let foto of photoService.photos" class="photo-col">
        <div class="photo-wrapper" (click)="abrirFoto(foto)">
          <ion-img [src]="foto.webviewPath" class="grid-img"></ion-img>
          <div class="photo-overlay">
            <ion-button
              fill="clear"
              size="small"
              color="danger"
              (click)="confirmarEliminar(foto, $event)"
              class="delete-btn">
              <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
            </ion-button>
          </div>
        </div>
        <p class="photo-date">{{ foto.fechaGuardado }}</p>
      </ion-col>
    </ion-row>
  </ion-grid>

</ion-content>

<!-- Modal: foto ampliada -->
<ion-modal [isOpen]="modalAbierto" (didDismiss)="cerrarModal()">
  <ng-template>
    <ion-header>
      <ion-toolbar color="dark">
        <ion-title color="light">Vista previa</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="cerrarModal()" color="light">
            <ion-icon name="close-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content color="dark" class="modal-content">
      <div class="modal-img-wrapper" *ngIf="fotoSeleccionada">
        <ion-img [src]="fotoSeleccionada.webviewPath" class="modal-img"></ion-img>
        <p class="modal-date">{{ fotoSeleccionada.fechaGuardado }}</p>
      </div>

      <div class="modal-actions">
        <ion-button
          expand="block"
          color="danger"
          fill="outline"
          (click)="confirmarEliminar(fotoSeleccionada!)"
          class="ion-margin-horizontal">
          <ion-icon name="trash-outline" slot="start"></ion-icon>
          Eliminar foto
        </ion-button>
      </div>
    </ion-content>
  </ng-template>
</ion-modal>
